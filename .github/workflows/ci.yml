name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Generate pilot variants
        run: |
          python -m promptnoise.cli generate             --input data/benchmark/pilot_50.csv             --output /tmp/pilot_variants.csv             --seed 20260927
      - name: Validate pilot variants
        run: python -m promptnoise.cli validate --input /tmp/pilot_variants.csv
